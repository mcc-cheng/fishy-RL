[project]
name = "fish"
version = "0.1.0"
description = "A reinforcement-learning solver for the card game Fish (Literature)"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
rl = ["torch"]

[tool.setuptools]
packages = ["fish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running statistical / soak tests"]
